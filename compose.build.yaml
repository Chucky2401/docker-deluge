---
services:
  deluge:
    container_name: deluge
    tty: true
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CREATED: |-
          $CREATED
        DIGEST: |-
          $DIGEST
        REVISION: |-
          $REVISION
        VERSION: "1.0.0"
    pull_policy: build
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    # This is mandatory for wireguard
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - LOCAL_NETWORK=192.168.1.0/24
      - DELUGE_LOGLEVEL=warning
      - DELUGE_DAEMON_USERNAME=user
      # Set the password directly with env var
      - DELUGE_DAEMON_PASSWORD=password
      # Or with a secret
      # - DELUGE_DAEMON_PASSWORD=/run/secrets/DELUGE_DAEMON_PASSWORD
      # Set the level of the user.
      # Valid value are:
      #   -  0: None
      #   -  1: Read only
      #   -  5: Normal
      #   - 10: Administrator
      - DELUGE_DAEMON_USER_LEVEL=10
      # Using vpn file from secret
      - VPN_FILE=/run/secrets/VPN_FILE
      - VPN_CREDENTIALS=/run/secrets/VPN_CREDENTIALS
      # You can use use VPN credentials with following variable
      # PRIVATE_KEY=<private-key>
      # PRESHARED_KEY=<preshared-key>
      # ADDRESS=<address>
      # - DELUGE_DAEMON_PORT=10000
    volumes:
      # If you comment this line below because of using secret for VPN_FILE
      # be warn that the log file will be lost after each compose destroy
      - ./config/:/deluge-conf
      # - /mnt/crucial:/downloads
    ports:
      # Web UI
      - 8112:8112
      # Deluge default P2P ports
      # - 6881:6881
      # - 6881:6881/udp
      # Default daemon port
      - 58846:58846
    networks:
      - deluge
    dns:
      - 8.8.8.8
      - 8.4.4.8
    dns_search: '.'
    restart: unless-stopped
    secrets:
      - VPN_CREDENTIALS
      # Using VPN_FILE with secret
      - VPN_FILE
      # Set DELUGE_DAEMON_PASSWORD with secret
      # - DELUGE_DAEMON_PASSWORD
    labels:
      - wud.watch=false
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  deluge:
    driver: bridge
    enable_ipv6: false

secrets:
  # The VPN_CREDENTIALS must have
  # private key on first line
  # preshared key on second line and
  # address on third line
  VPN_CREDENTIALS:
    file: ./.secrets/vpn_credentials
  # VPN_FILE as secret
  VPN_FILE:
    file: ./.secrets/SeStockholm.conf
  # DELUGE_DAEMON_PASSWORD as secret
  # DELUGE_DAEMON_PASSWORD:
  #   file: deluge_daemon_password
